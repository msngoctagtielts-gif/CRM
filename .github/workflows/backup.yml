name: Sao lưu cơ sở dữ liệu

# Gói Free của Supabase KHÔNG cho tải bản sao lưu, và không có sao lưu hằng
# ngày. Job này tự dump ra ngoài, mã hoá, rồi giữ làm artifact của GitHub.
# Miễn phí, và là lớp bảo vệ duy nhất trước việc xoá nhầm hoặc hỏng dữ liệu.
#
# ⚠ Artifact của GitHub bị xoá sau thời gian lưu giữ (mặc định 90 ngày). Mỗi
#    tháng nên tải một bản về máy hoặc Google Drive để giữ lâu dài.
# ⚠ GitHub tự tắt workflow theo lịch nếu repo không có commit nào trong 60 ngày.

on:
  schedule:
    # 18:30 UTC = 01:30 giờ Việt Nam — sau khi trung tâm đã dạy xong trong ngày.
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  dump:
    name: Dump và mã hoá
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài PostgreSQL client 17
        # Máy chủ Supabase chạy PostgreSQL 17. pg_dump TỪ CHỐI chạy khi bản thân
        # nó cũ hơn máy chủ, mà ubuntu-latest chỉ có client 16 — nên phải cài
        # thêm từ kho chính thức của PostgreSQL.
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Sao lưu
        env:
          # Phải là chuỗi "Session pooler". Kết nối trực tiếp
          # db.<ref>.supabase.co CHỈ CÓ IPv6, mà máy chạy GitHub Actions chỉ có
          # IPv4 — dùng chuỗi trực tiếp sẽ treo rồi báo lỗi mạng.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: ./scripts/backup/dump.sh backups

      - name: Giữ lại bản sao lưu
        uses: actions/upload-artifact@v4
        with:
          name: mnee-backup-${{ github.run_id }}
          path: backups/*.tar.gpg
          retention-days: 90
          if-no-files-found: error
