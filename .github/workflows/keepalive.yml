name: Keep Supabase awake

# Gói Free của Supabase tạm dừng project sau 7 ngày ít hoạt động. Vài truy vấn
# mỗi ngày là đủ để không bị dừng, nên job này gửi một truy vấn nhẹ hằng ngày.
# Nếu project bị dừng, app sập cho tới khi có người vào bấm "Resume" — với một
# trung tâm đang dạy thật thì đó là mất buổi làm việc.
#
# Miễn phí: GitHub Actions cho 2.000 phút/tháng với repo riêng tư. Job này chạy
# vài giây mỗi ngày.
#
# ⚠ GitHub TỰ TẮT workflow theo lịch nếu repo không có commit nào trong 60 ngày.
#    Nhận email báo thì vào tab Actions bấm bật lại.

on:
  schedule:
    # 01:00 UTC = 08:00 giờ Việt Nam, mỗi ngày.
    - cron: '0 1 * * *'
  workflow_dispatch:

jobs:
  ping:
    name: Gửi truy vấn giữ project hoạt động
    runs-on: ubuntu-latest
    # Đưa secret lên env ở cấp job vì ngữ cảnh `secrets` KHÔNG dùng được trong
    # `if:` của step — viết `if: secrets.X != ''` sẽ luôn sai.
    env:
      APP_URL: ${{ secrets.APP_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Truy vấn Supabase
        env:
          # Dùng CHUNG secret với job sao lưu. Bản cũ đòi SUPABASE_URL và
          # SUPABASE_ANON_KEY — hai secret chưa bao giờ được đặt, nên job này
          # hỏng mọi lần chạy từ 10/09 tới 17/09/2026 và trung tâm không hề
          # được bảo vệ khỏi việc project bị tạm dừng. Đổi sang SUPABASE_DB_URL
          # là secret đã có sẵn và đã chứng minh chạy được ở backup.yml.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "Thiếu secret SUPABASE_DB_URL — xem docs/FREE_TIER.md" >&2
            exit 1
          fi

          # psql có sẵn trên ubuntu-latest. Khác pg_dump, psql KHÔNG từ chối khi
          # client cũ hơn máy chủ, nên không cần cài PostgreSQL 17 như backup.yml.
          if ! command -v psql > /dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq postgresql-client
          fi

          # Một truy vấn chạm thật vào PostgreSQL. Không đọc dữ liệu học viên —
          # chỉ cần có hoạt động để Supabase không tính project là nhàn rỗi.
          psql "$SUPABASE_DB_URL" -Atc 'select 1' --set ON_ERROR_STOP=1
          echo "Project đang hoạt động."

      - name: Quét cảnh báo (nếu app đã triển khai)
        # Không bắt buộc. Chưa triển khai app thì bỏ qua, không làm hỏng job.
        if: env.APP_URL != '' && env.CRON_SECRET != ''
        run: |
          set -euo pipefail
          curl -sS -X POST "$APP_URL/api/cron/scan-reports" \
            -H "Authorization: Bearer $CRON_SECRET" --max-time 60 | head -c 500
          echo
